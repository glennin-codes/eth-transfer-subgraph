specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # Data Source 1: Native ETH Transfers
  - kind: ethereum/contract
    name: NativeETH
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000000" # ETH transfers
      abi: EthTransfer
      startBlock: 19200000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: EthTransfer
          file: ./abis/EthTransfer.json
      callHandlers:
        - function: default()
          handler: handleEthTransfer
      file: ./src/mapping.ts

  # Data Source 2: USDC Transfers (ERC-20)
  - kind: ethereum/contract
    name: UsdcToken
    network: mainnet
    source:
      address: "0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48" # Ethereum USDC
      abi: Usdc
      startBlock: 11565019 # USDC deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.8
      language: wasm/assemblyscript
      entities:
        - Transfer
      abis:
        - name: Usdc
          file: ./abis/Usdc.json # Standard ERC-20 ABI
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleUSDCTransfer # Fixed handler name
      file: ./src/mapping.ts
